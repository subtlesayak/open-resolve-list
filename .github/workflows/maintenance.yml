name: Weekly catalogue maintenance check
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-maintenance
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check GitHub releases and repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-updates.mjs --github
      - name: Check repository changelog files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-updates.mjs --github-changelogs
      - name: Check external source pages
        run: node scripts/check-updates.mjs --external
      - name: Write aggregate review summary
        if: always()
        run: node scripts/maintenance-summary.mjs >> "$GITHUB_STEP_SUMMARY"
