<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="robots" content="noindex">
 <meta name="referrer" content="no-referrer">
 <title>Buy me a coffee</title>
 <style>
  /* Match the iframe's scheme so its canvas stays transparent in either site theme. */
  :root { color-scheme:only light; }
  body { margin:0; min-height:74px; display:grid; place-items:center; }
  .bmc-btn-container .bmc-btn { justify-content:center; padding-inline:16px; }
  .bmc-btn .bmc-btn-text { width:auto; }
  .support-fallback img { display:block; max-width:100%; height:auto; }
  body:has(.bmc-btn) .support-fallback { display:none; }
  a:focus-visible { outline:2px solid #0d0c22; outline-offset:2px; box-shadow:0 0 0 5px #fff; }
 </style>
</head>
<body>
 <script src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button"
  data-slug="subtlesayak" data-color="#FFDD00" data-emoji="" data-font="Cookie"
  data-text="Buy me a coffee" data-font-color="#000000" data-outline-color="#000000" data-coffee-color="#FFDD00"></script>
 <a class="support-fallback" href="https://www.buymeacoffee.com/subtlesayak" target="_blank" rel="noopener noreferrer">
  <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy me a coffee" width="210" height="59">
 </a>
</body>
</html>
